<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefas - Mobilli Digital</title>
<style>
:root {
  --bg: #0a0a0f; --card: #13131f; --card2: #1a1a2e;
  --border: #1e2040; --blue: #3b82f6; --blue-bright: #60a5fa;
  --text-primary: #f0f4ff; --text-secondary: #8892b0; --text-muted: #4a5568;
  --green: #10b981; --amber: #f59e0b; --purple: #8b5cf6;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; flex-direction: column; }

/* TOPBAR */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.topbar-logo { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-primary); }
.topbar-logo span { color: var(--blue); }
.topbar-nav { display: flex; gap: 2px; }
.topbar-link { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; display: inline-block; }
.topbar-link:hover { color: var(--text-primary); background: var(--card); }
.topbar-link.active { color: var(--text-primary); }

/* MAIN */
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.content { flex: 1; overflow-y: auto; padding: 2rem; }
.inner { max-width: 980px; margin: 0 auto; }

/* HEADER */
.page-header { margin-bottom: 1.5rem; }
.page-header h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.page-header p { font-size: 13px; color: var(--text-secondary); }

/* INPUT RÁPIDO */
.quick-add { display: flex; gap: 8px; margin-bottom: 2rem; background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 10px 12px; transition: border-color 0.2s; }
.quick-add:focus-within { border-color: #374151; }
.quick-input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: var(--text-primary); font-family: inherit; }
.quick-input::placeholder { color: var(--text-muted); }
.prazo-select { background: var(--card2); border: 0.5px solid var(--border); border-radius: 6px; padding: 0 10px; font-size: 13px; color: var(--text-secondary); outline: none; font-family: inherit; height: 32px; cursor: pointer; }
.btn-add { height: 32px; padding: 0 14px; background: var(--blue); border: none; border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background 0.15s; }
.btn-add:hover { background: var(--blue-bright); }

/* QUADROS */
.boards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.board { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.25rem; display: flex; flex-direction: column; min-height: 400px; }
.board-header { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
.board-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.board.hoje .board-dot { background: var(--blue); }
.board.amanha .board-dot { background: var(--amber); }
.board.semana .board-dot { background: var(--purple); }
.board-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.board-count { font-size: 11px; color: var(--text-muted); background: var(--card2); padding: 2px 7px; border-radius: 20px; margin-left: auto; }
.board-tasks { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--card2); border-radius: 10px; cursor: pointer; transition: all 0.15s; border: 0.5px solid transparent; }
.task:hover { border-color: var(--border); }
.task-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; margin-top: 1px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
.task:hover .task-check { border-color: var(--green); }
.task.completing .task-check { background: var(--green); border-color: var(--green); }
.task.completing .task-check::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 700; }
.task.completing .task-text { text-decoration: line-through; color: var(--text-muted); }
.task-text { font-size: 13px; line-height: 1.4; color: var(--text-secondary); flex: 1; }
.empty-board { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; text-align: center; padding: 2rem; }

/* LOADING */
.loading { color: var(--text-muted); font-size: 13px; text-align: center; padding: 1rem; }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/">📡 Mobilli <span>Digital</span></a>
  <div class="topbar-nav">
    <a class="topbar-link" href="/">Início</a>
    <a class="topbar-link" href="/">Visão Geral</a>
    <a class="topbar-link" href="/faturamento">Faturamento</a>
    <a class="topbar-link active" href="/tarefas">Tarefas</a>
  </div>
</div>

<div class="main">
  <div class="content">
    <div class="inner">

      <div class="page-header">
        <h2>📋 Tarefas</h2>
        <p>Organize o que precisa fazer hoje, amanhã e essa semana</p>
      </div>

      <!-- INPUT RÁPIDO -->
      <div class="quick-add">
        <input class="quick-input" id="task-input" placeholder="Nova tarefa..." onkeydown="handleKey(event)">
        <select class="prazo-select" id="task-prazo">
          <option value="hoje">📅 Hoje</option>
          <option value="amanha">📆 Amanhã</option>
          <option value="semana">🗓 Essa semana</option>
        </select>
        <button class="btn-add" onclick="addTarefa()">+ Adicionar</button>
      </div>

      <!-- QUADROS -->
      <div class="boards">
        <div class="board hoje">
          <div class="board-header">
            <div class="board-dot"></div>
            <span class="board-title">Hoje</span>
            <span class="board-count" id="count-hoje">0</span>
          </div>
          <div class="board-tasks" id="board-hoje"><div class="loading">Carregando...</div></div>
        </div>
        <div class="board amanha">
          <div class="board-header">
            <div class="board-dot"></div>
            <span class="board-title">Amanhã</span>
            <span class="board-count" id="count-amanha">0</span>
          </div>
          <div class="board-tasks" id="board-amanha"><div class="loading">Carregando...</div></div>
        </div>
        <div class="board semana">
          <div class="board-header">
            <div class="board-dot"></div>
            <span class="board-title">Essa semana</span>
            <span class="board-count" id="count-semana">0</span>
          </div>
          <div class="board-tasks" id="board-semana"><div class="loading">Carregando...</div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
let tarefas = [];

async function loadTarefas(){
  try{
    const r = await fetch('/api/tarefas');
    const j = await r.json();
    if(j.ok){ tarefas = j.data; render(); }
  }catch(e){ console.error(e); }
}

function render(){
  const grupos = { hoje: [], amanha: [], semana: [] };
  tarefas.forEach(t => { if(grupos[t.prazo]) grupos[t.prazo].push(t); });

  for(const prazo of ['hoje','amanha','semana']){
    const board = document.getElementById('board-'+prazo);
    const count = document.getElementById('count-'+prazo);
    count.textContent = grupos[prazo].length;

    if(!grupos[prazo].length){
      board.innerHTML = '<div class="empty-board">Nenhuma tarefa 🎉</div>';
      continue;
    }

    board.innerHTML = grupos[prazo].map(t => `
      <div class="task" id="task-${t.id}" onclick="concluir(${t.id})">
        <div class="task-check"></div>
        <div class="task-text">${t.titulo}</div>
      </div>
    `).join('');
  }
}

async function concluir(id){
  const el = document.getElementById('task-'+id);
  if(!el) return;
  el.classList.add('completing');
  setTimeout(async () => {
    await fetch('/api/tarefas/'+id, {method:'DELETE'});
    tarefas = tarefas.filter(t=>t.id!==id);
    render();
  }, 400);
}

async function addTarefa(){
  const input = document.getElementById('task-input');
  const prazo = document.getElementById('task-prazo').value;
  const titulo = input.value.trim();
  if(!titulo) return;
  input.value = '';
  const r = await fetch('/api/tarefas', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({titulo, prazo})
  });
  const j = await r.json();
  if(j.ok) loadTarefas();
}

function handleKey(e){
  if(e.key==='Enter') addTarefa();
}

loadTarefas();
</script>
</body>
</html>
