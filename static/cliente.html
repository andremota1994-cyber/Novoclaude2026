<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente - Mobilli Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #060504; --card: rgba(228,190,110,0.055); --card2: rgba(228,190,110,0.10);
  --border: rgba(228,190,110,0.16); --border-strong: rgba(228,190,110,0.30);
  --blue: #d4af37; --blue-bright: #f3d888;
  --grad: linear-gradient(135deg, #f3d888, #9c7a24);
  --text-primary: #f7f3ea; --text-secondary: #a89a78; --text-muted: #6b6047;
  --green: #2fd97f; --amber: #ff9d42; --purple: #c9a8ff;
  --red: #ff5c72; --red-bg: rgba(255,92,114,0.08); --red-border: rgba(255,92,114,0.28);
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; flex-direction: column; position: relative; }
.bg-ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob-a, .blob-b { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; }
.blob-a { width: 520px; height: 520px; background: radial-gradient(circle, rgba(212,175,55,.35), transparent 70%); top: -160px; left: -120px; animation: driftA 24s ease-in-out infinite; }
.blob-b { width: 480px; height: 480px; background: radial-gradient(circle, rgba(156,122,36,.28), transparent 70%); bottom: -180px; right: -140px; animation: driftB 28s ease-in-out infinite; }
@keyframes driftA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
@keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
.topbar, .main { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) {
  .blob-a, .blob-b { animation: none !important; }
  * { transition: none !important; }
}

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
.topbar-logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text-primary); font-family: 'Sora', sans-serif; }
.topbar-logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.topbar-nav { display: flex; gap: 2px; flex-wrap: wrap; }
.topbar-link { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; display: inline-block; }
.topbar-link:hover { color: var(--text-primary); background: var(--card); }
.topbar-link.active { color: var(--text-primary); }

.main { flex: 1; overflow-y: auto; padding: 2rem; }
.inner { max-width: 980px; margin: 0 auto; }

.back-link { font-size: 13px; color: var(--text-secondary); text-decoration: none; display: inline-block; margin-bottom: 1rem; }
.back-link:hover { color: var(--text-primary); }

.perfil-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
.nome-input { font-size: 24px; font-weight: 600; background: transparent; border: none; border-bottom: 1px dashed transparent; color: var(--text-primary); font-family: 'Sora', sans-serif; padding: 2px 0; outline: none; width: 100%; }
.nome-input:hover, .nome-input:focus { border-bottom-color: var(--border-strong); }
.perfil-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nivel-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; }
.nivel-ouro { background: #1a1500; color: var(--amber); border: 0.5px solid #3d3000; }
.nivel-prata { background: #111827; color: #94a3b8; border: 0.5px solid #1f2937; }
.nivel-bronze { background: #1a0f00; color: #d97706; border: 0.5px solid #3d2000; }
.status-acoes { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.btn-sit { height: 34px; padding: 0 14px; border-radius: var(--radius); font-size: 12px; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.btn-sit.pausar { border: 0.5px solid rgba(255,157,66,0.35); background: rgba(255,157,66,0.08); color: var(--amber); }
.btn-sit.reativar { border: 0.5px solid rgba(47,217,127,0.35); background: rgba(47,217,127,0.08); color: var(--green); }
.sit-badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; }
.sit-badge.pausado { background: rgba(255,157,66,0.10); color: var(--amber); border: 0.5px solid rgba(255,157,66,0.30); }
.sit-badge.inativo { background: var(--card2); color: var(--text-muted); border: 0.5px solid var(--border); }
.btn-remover { height: 34px; padding: 0 14px; border-radius: var(--radius); font-size: 12px; cursor: pointer; font-family: inherit; border: 0.5px solid var(--red-border); background: var(--red-bg); color: var(--red); flex-shrink: 0; }

.section-title { font-size: 13px; font-weight: 600; margin: 1.5rem 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.section-title:first-of-type { margin-top: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.field-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; }
.field-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
.field-value { font-size: 18px; font-weight: 600; }
.field-value.green { color: var(--green); }
.field-value.red { color: var(--red); }
.field-value.blue { color: var(--blue-bright); }
.field-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.field-input { background: var(--card2); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text-primary); padding: 6px 8px; font-size: 15px; font-family: inherit; width: 100%; font-weight: 600; }
.field-input:focus { border-color: var(--border-strong); outline: none; }
.indic-row { display: flex; align-items: center; gap: 10px; }
.indic-btn { width: 28px; height: 28px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--card2); color: var(--text-primary); font-size: 15px; cursor: pointer; }
.indic-btn:hover { border-color: var(--border-strong); }

.form-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.form-field label { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.03em; }
.form-field input, .form-field select { width: 100%; height: 38px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 0 10px; font-size: 13px; background: var(--card2); color: var(--text-primary); outline: none; font-family: inherit; }
.form-field input:focus, .form-field select:focus { border-color: var(--border-strong); }
.form-field select option { background: #171206; }

.ads-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; }
.ads-select-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 1rem; flex-wrap: wrap; }
.ads-select-row .form-field { flex: 1; min-width: 200px; }
.ads-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.ads-stat { background: var(--card2); border: 0.5px solid var(--border); border-radius: 10px; padding: 0.7rem 0.85rem; }
.ads-stat .lbl { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
.ads-stat .val { font-size: 15px; font-weight: 600; margin-top: 2px; }
.ads-empty { font-size: 13px; color: var(--text-muted); padding: 0.5rem 0; }
.conta-combo { position: relative; }
.conta-combo input { padding-right: 34px; }
.conta-combo .combo-icon { position: absolute; right: 11px; bottom: 11px; width: 16px; height: 16px; color: var(--text-secondary); pointer-events: none; }
.combo-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50; max-height: 280px; overflow-y: auto; background: #171206; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); display: none; }
.combo-list.open { display: block; }
.combo-opt { padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--text-primary); cursor: pointer; }
.combo-opt mark { background: none; color: var(--blue-bright); font-weight: 600; }
.combo-opt.active { background: var(--card2); }
.combo-opt.atual { color: var(--blue-bright); }
.combo-opt.remover { color: var(--red); }
.combo-empty { padding: 10px; font-size: 12px; color: var(--text-muted); }
.combo-tag { margin-left: 8px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }

.risco-card { border-radius: 16px; padding: 1.25rem; border: 1px solid; }
.risco-card.baixo { background: rgba(47,217,127,0.06); border-color: rgba(47,217,127,0.28); }
.risco-card.medio { background: rgba(255,157,66,0.07); border-color: rgba(255,157,66,0.30); }
.risco-card.alto { background: var(--red-bg); border-color: var(--red-border); }
.risco-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.risco-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.03em; }
.risco-badge.baixo { background: rgba(47,217,127,0.15); color: var(--green); }
.risco-badge.medio { background: rgba(255,157,66,0.15); color: var(--amber); }
.risco-badge.alto { background: rgba(255,92,114,0.15); color: var(--red); }
.risco-motivos { list-style: none; font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 5px; }
.risco-motivos li::before { content: '• '; color: var(--text-muted); }
.risco-ok { font-size: 13px; color: var(--text-secondary); }

.loading-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; text-align: center; color: var(--text-secondary); font-size: 14px; }

@media (max-width: 560px) {
  .main { padding: 1.25rem; }
  .topbar { padding: 0.6rem 1rem; }
  .topbar-link { padding: 6px 10px; font-size: 12px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .nome-input { font-size: 20px; }
}
</style>
</head>
<body>

<div class="bg-ambient"><div class="blob-a"></div><div class="blob-b"></div></div>

<div class="topbar" id="menu-principal"></div>
<script src="/static/menu.js"></script>
<div class="main">
  <div class="inner" id="conteudo">
    <a class="back-link" href="/clientes">← Voltar para Clientes</a>
    <div class="loading-box">Carregando...</div>
  </div>
</div>

<script>
const clienteId = window.location.pathname.split('/').filter(Boolean).pop();
const OCUPACOES = [
  {v:'corretor', l:'Corretor'}, {v:'gerente', l:'Gerente'}, {v:'imobiliaria', l:'Imobiliária'},
  {v:'superintendente', l:'Superintendente'}, {v:'diretor', l:'Diretor'}, {v:'outro', l:'Outro'}
];
let cliente = null;
let contasDisponiveis = [];

function fmt(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function escAttr(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function escHtml(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function semAcento(v){ return String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

// Busca da conta de anúncios: filtra enquanto digita, sem depender do datalist do navegador
let comboOpcoes = [];
let comboAtivo = -1;

function comboDestacar(nome, termo){
  if (!termo) return escHtml(nome);
  const i = semAcento(nome).indexOf(semAcento(termo));
  if (i < 0) return escHtml(nome);
  return escHtml(nome.slice(0, i)) + '<mark>' + escHtml(nome.slice(i, i + termo.length)) + '</mark>' + escHtml(nome.slice(i + termo.length));
}

function comboAbrir(){
  const input = document.getElementById('input-conta-anuncio');
  const termo = input.value.trim();
  const atual = cliente.conta_anuncio || '';
  // Com a conta atual no campo, mostra a lista inteira em vez de filtrar por ela
  const filtro = termo === atual ? '' : termo;
  const contas = contasDisponiveis.filter(a => a.account_name)
    .filter(a => !filtro || semAcento(a.account_name).includes(semAcento(filtro)))
    .sort((a, b) => a.account_name.localeCompare(b.account_name, 'pt-BR'));
  comboOpcoes = contas.map(a => ({
    valor: a.account_name,
    html: comboDestacar(a.account_name, filtro) + (a.com_gasto === false ? '<span class="combo-tag">sem gasto em 30 dias</span>' : ''),
    classe: a.account_name === atual ? 'atual' : ''
  }));
  if (atual && !filtro) comboOpcoes.unshift({valor: '', html: 'Remover vínculo', classe: 'remover'});
  comboAtivo = comboOpcoes.length && filtro ? 0 : -1;
  comboRender();
}

function comboRender(){
  const lista = document.getElementById('combo-contas');
  lista.innerHTML = comboOpcoes.length
    ? comboOpcoes.map((o, i) => `<div class="combo-opt ${o.classe} ${i === comboAtivo ? 'active' : ''}" role="option" onmousedown="event.preventDefault(); comboEscolher(${i})">${o.html}</div>`).join('')
    : `<div class="combo-empty">${contasDisponiveis.length ? 'Nenhuma conta encontrada.' : 'Nenhuma conta de anúncios disponível.'}</div>`;
  lista.classList.add('open');
  const ativo = lista.querySelector('.combo-opt.active');
  if (ativo) ativo.scrollIntoView({block: 'nearest'});
}

function comboFechar(){
  const lista = document.getElementById('combo-contas');
  if (lista) lista.classList.remove('open');
  const input = document.getElementById('input-conta-anuncio');
  if (input) input.value = cliente.conta_anuncio || '';
  comboAtivo = -1;
}

function comboTeclas(e){
  const aberta = document.getElementById('combo-contas').classList.contains('open');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!aberta) { comboAbrir(); return; }
    if (!comboOpcoes.length) return;
    comboAtivo = e.key === 'ArrowDown'
      ? (comboAtivo + 1) % comboOpcoes.length
      : (comboAtivo <= 0 ? comboOpcoes.length - 1 : comboAtivo - 1);
    comboRender();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (aberta && comboAtivo >= 0) comboEscolher(comboAtivo);
  } else if (e.key === 'Escape') {
    comboFechar();
    e.target.blur();
  }
}

function comboEscolher(i){
  const o = comboOpcoes[i];
  if (!o) return;
  const mudou = o.valor !== (cliente.conta_anuncio || '');
  cliente.conta_anuncio = o.valor;
  document.getElementById('input-conta-anuncio').blur();
  if (mudou) salvarPerfil('conta_anuncio', o.valor);
}

function fmtTempoCasa(dias){
  if (dias === null || dias === undefined) return '—';
  if (dias < 30) return dias + ' dia' + (dias === 1 ? '' : 's');
  const meses = Math.floor(dias / 30);
  if (meses < 12) return meses + ' mes' + (meses === 1 ? '' : 'es');
  const anos = Math.floor(meses / 12);
  const restoMeses = meses % 12;
  return anos + ' ano' + (anos === 1 ? '' : 's') + (restoMeses ? ' e ' + restoMeses + ' mes' + (restoMeses === 1 ? '' : 'es') : '');
}

async function carregar(){
  try {
    const [rc, ra] = await Promise.all([
      fetch('/api/clientes/' + clienteId),
      fetch('/api/contas-anuncio')
    ]);
    const jc = await rc.json();
    const ja = await ra.json();
    if (!jc.ok) { document.getElementById('conteudo').innerHTML = '<a class="back-link" href="/clientes">← Voltar para Clientes</a><div class="loading-box">Erro: ' + jc.error + '</div>'; return; }
    cliente = jc.data;
    contasDisponiveis = ja.ok ? ja.data : [];
    render();
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<a class="back-link" href="/clientes">← Voltar para Clientes</a><div class="loading-box">Erro de conexão.</div>';
  }
}

function render(){
  const c = cliente;
  const risco = c.risco_churn || {nivel:'baixo', motivos:[]};
  const nivelIcon = c.nivel === 'ouro' ? '🥇 Ouro' : c.nivel === 'prata' ? '🥈 Prata' : '🥉 Bronze';

  const opcoesOcupacao = ['<option value="">—</option>']
    .concat(OCUPACOES.map(o => `<option value="${o.v}" ${c.ocupacao === o.v ? 'selected' : ''}>${o.l}</option>`))
    .join('');

  document.getElementById('conteudo').innerHTML = `
    <a class="back-link" href="/clientes">← Voltar para Clientes</a>

    <div class="perfil-header">
      <div style="flex:1;min-width:220px">
        <input class="nome-input" id="f-nome" value="${c.nome || ''}" onchange="salvarPerfil('nome', this.value)">
        <div class="perfil-sub">
          <span class="nivel-badge nivel-${c.nivel}">${nivelIcon}</span>
          ${c.empresa ? '<span>' + c.empresa + '</span>' : ''}
          ${situacaoBadge(c)}
        </div>
      </div>
      <div class="status-acoes">${situacaoBotoes(c)}</div>
    </div>

    <div class="section-title">Contrato e financeiro</div>
    <div class="grid">
      <div class="field-card">
        <div class="field-label">Início do contrato</div>
        <input type="date" class="field-input" value="${c.data_inicio || ''}" onchange="salvarPerfil('data_inicio', this.value)">
      </div>
      <div class="field-card">
        <div class="field-label">Tempo de casa</div>
        <div class="field-value blue">${fmtTempoCasa(c.tempo_casa_dias)}</div>
      </div>
      <div class="field-card">
        <div class="field-label">Valor mensal</div>
        <input type="number" class="field-input" value="${c.valor}" min="0.01" step="0.01" onchange="salvarValor(this.value)">
      </div>
      <div class="field-card">
        <div class="field-label">Dia de vencimento</div>
        <input type="number" class="field-input" value="${c.dia_pagamento || ''}" min="1" max="31" onchange="salvarDia(this.value)">
      </div>
      <div class="field-card">
        <div class="field-label">Status do mês atual</div>
        <div class="field-value ${c.atrasado_atual ? 'red' : 'green'}">${c.atrasado_atual ? '⚠️ Atrasado' : '✅ Em dia'}</div>
        <div class="field-sub"><a href="/faturamento" style="color:var(--text-secondary)">Ver em Faturamento →</a></div>
      </div>
      <div class="field-card">
        <div class="field-label">Receita total gerada</div>
        <div class="field-value blue">${fmt(c.receita_total)}</div>
        <div class="field-sub">${c.meses_pagos} mes(es) pago(s)</div>
      </div>
      <div class="field-card">
        <div class="field-label">Indicações feitas</div>
        <div class="indic-row">
          <button class="indic-btn" onclick="alterarIndicacoes(-1)">−</button>
          <div class="field-value" id="indic-valor">${c.indicacoes || 0}</div>
          <button class="indic-btn" onclick="alterarIndicacoes(1)">+</button>
        </div>
      </div>
    </div>

    <div class="section-title">Dados do cliente</div>
    <div class="form-card">
      <div class="form-grid">
        <div class="form-field"><label>Telefone</label><input value="${c.telefone || ''}" placeholder="(11) 90000-0000" onchange="salvarPerfil('telefone', this.value)"></div>
        <div class="form-field"><label>Ocupação</label><select onchange="salvarPerfil('ocupacao', this.value)">${opcoesOcupacao}</select></div>
        <div class="form-field"><label>Empresa</label><input value="${c.empresa || ''}" placeholder="Nome da imobiliária/empresa" onchange="salvarPerfil('empresa', this.value)"></div>
      </div>
    </div>

    <div class="section-title">Conta de anúncios (Meta Ads)</div>
    <div class="ads-card">
      <div class="ads-select-row">
        <div class="form-field conta-combo">
          <label for="input-conta-anuncio">Conta vinculada</label>
          <input type="text" id="input-conta-anuncio" autocomplete="off" role="combobox" aria-controls="combo-contas"
                 placeholder="Buscar conta pelo nome..." value="${escAttr(c.conta_anuncio || '')}"
                 onfocus="this.select(); comboAbrir()" oninput="comboAbrir()" onkeydown="comboTeclas(event)" onblur="comboFechar()">
          <svg class="combo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <div class="combo-list" id="combo-contas" role="listbox"></div>
        </div>
      </div>
      ${c.ads_info ? `
        <div class="ads-stats">
          <div class="ads-stat"><div class="lbl">Investimento (30d)</div><div class="val">${fmt(c.ads_info.spend)}</div></div>
          <div class="ads-stat"><div class="lbl">Leads</div><div class="val">${c.ads_info.leads}</div></div>
          <div class="ads-stat"><div class="lbl">Conversas</div><div class="val">${c.ads_info.msg}</div></div>
          <div class="ads-stat"><div class="lbl">Resultados</div><div class="val">${c.ads_info.total}</div></div>
          <div class="ads-stat"><div class="lbl">CPL</div><div class="val">${c.ads_info.cpl !== null ? fmt(c.ads_info.cpl) : '—'}</div></div>
        </div>
      ` : `<div class="ads-empty">${c.conta_anuncio ? 'Conta vinculada, mas sem dados nos últimos 30 dias.' : 'Nenhuma conta de anúncios vinculada ainda.'}</div>`}
    </div>

    <div class="section-title">Risco de churn</div>
    <div class="risco-card ${risco.nivel}">
      <div class="risco-top">
        <span class="risco-badge ${risco.nivel}">${risco.nivel}</span>
      </div>
      ${risco.motivos && risco.motivos.length ? '<ul class="risco-motivos">' + risco.motivos.map(m => '<li>' + m + '</li>').join('') + '</ul>' : '<div class="risco-ok">Nenhum sinal de risco identificado no momento.</div>'}
    </div>
  `;
}

async function salvarPerfil(campo, valor){
  await fetch('/api/clientes/' + clienteId + '/perfil', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({[campo]: valor})});
  await carregar();
}

async function salvarValor(valor){
  const v = parseFloat(valor);
  if (isNaN(v) || v <= 0) { alert('Informe um valor válido.'); await carregar(); return; }
  await fetch('/api/clientes/' + clienteId + '/valor', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({valor: v})});
  await carregar();
}

async function salvarDia(valor){
  const d = parseInt(valor, 10);
  await fetch('/api/clientes/' + clienteId + '/dia', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dia_pagamento: isNaN(d) ? null : d})});
  await carregar();
}

async function alterarIndicacoes(delta){
  const r = await fetch('/api/clientes/' + clienteId + '/indicacoes', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({delta})});
  const j = await r.json();
  if (j.ok) { document.getElementById('indic-valor').textContent = j.indicacoes; cliente.indicacoes = j.indicacoes; }
}

// Situação: ativo (entra no faturamento, gestores e painéis), pausado (parou por um tempo) ou inativo (saiu)
function situacao(c){ return c.ativo ? 'ativo' : (c.status === 'pausado' ? 'pausado' : 'inativo'); }
function dataBR(d){ return d ? new Date(d + (d.length > 10 && !/[zZ+]/.test(d.slice(10)) ? 'Z' : '')).toLocaleDateString('pt-BR') : ''; }

function situacaoBadge(c){
  const s = situacao(c);
  if (s === 'pausado') return `<span class="sit-badge pausado">⏸ Pausado${c.pausado_em ? ' desde ' + dataBR(c.pausado_em) : ''}</span>`;
  if (s === 'inativo') return `<span class="sit-badge inativo">Inativo${c.inativado_em ? ' desde ' + dataBR(c.inativado_em) : ''}</span>`;
  return '';
}

function situacaoBotoes(c){
  const s = situacao(c);
  const b = [];
  if (s !== 'ativo') b.push(`<button class="btn-sit reativar" onclick="mudarSituacao('ativo')">▶ Reativar</button>`);
  if (s === 'ativo') b.push(`<button class="btn-sit pausar" onclick="mudarSituacao('pausado')">⏸ Pausar</button>`);
  if (s !== 'inativo') b.push(`<button class="btn-remover" onclick="mudarSituacao('inativo')">Inativar</button>`);
  return b.join('');
}

const CONFIRMA = {
  pausado: n => 'Pausar ' + n + '? Ele sai do Faturamento, do quadro Gestores e do painel do gestor até ser reativado. O card continua em Clientes.',
  inativo: n => 'Inativar ' + n + '? Ele sai do Faturamento, do quadro Gestores e do painel do gestor. O card continua em Clientes, como Inativo.',
  ativo:   n => 'Reativar ' + n + '? Ele volta para o Faturamento (mensalidade do mês atual), o quadro Gestores e o painel do gestor.'
};

async function mudarSituacao(status){
  if (!confirm(CONFIRMA[status](cliente ? cliente.nome : 'este cliente'))) return;
  const r = await fetch('/api/clientes/' + clienteId + '/status', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})});
  const j = await r.json().catch(() => ({ok: false, error: 'erro ' + r.status}));
  if (!j.ok) { alert('Não foi possível mudar a situação: ' + j.error); return; }
  await carregar();
}

carregar();
</script>
