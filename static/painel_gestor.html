<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads - Mobilli Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #060504; --card: rgba(228,190,110,0.055); --card2: rgba(228,190,110,0.10);
  --border: rgba(228,190,110,0.16); --border-strong: rgba(228,190,110,0.30);
  --blue: #d4af37; --blue-bright: #f3d888;
  --grad: linear-gradient(135deg, #f3d888, #9c7a24);
  --text-primary: #f7f3ea; --text-secondary: #a89a78; --text-muted: #6b6047;
  --green: #2fd97f; --amber: #ff9d42; --purple: #c9a8ff;
  --red: #ff5c72; --red-bg: rgba(255,92,114,0.08); --red-border: rgba(255,92,114,0.28);
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; flex-direction: column; position: relative; }
.bg-ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob-a, .blob-b { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; }
.blob-a { width: 520px; height: 520px; background: radial-gradient(circle, rgba(212,175,55,.35), transparent 70%); top: -160px; left: -120px; animation: driftA 24s ease-in-out infinite; }
.blob-b { width: 480px; height: 480px; background: radial-gradient(circle, rgba(156,122,36,.28), transparent 70%); bottom: -180px; right: -140px; animation: driftB 28s ease-in-out infinite; }
@keyframes driftA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
@keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
.topbar, .main { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .blob-a, .blob-b { animation: none !important; } * { transition: none !important; } }

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
.topbar-logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text-primary); font-family: 'Sora', sans-serif; }
.topbar-logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.topbar-nav { display: flex; gap: 2px; }
.topbar-link { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; display: inline-block; }
.topbar-link:hover { color: var(--text-primary); background: var(--card); }
.topbar-link.active { color: var(--text-primary); background: var(--card2); }
.topbar-user { font-size: 12px; color: var(--text-muted); }
.btn-logout { font-size: 12px; color: var(--text-secondary); text-decoration: none; padding: 6px 12px; border-radius: 8px; border: 0.5px solid var(--border); }
.btn-logout:hover { color: var(--text-primary); background: var(--card); }

.main { flex: 1; overflow-y: auto; padding: 2rem; }
.inner { max-width: 1080px; margin: 0 auto; }
.page-header { margin-bottom: 1.5rem; }
.page-header h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.page-header p { font-size: 13px; color: var(--text-secondary); }

.ptabs { display: flex; gap: 2px; margin-bottom: 1.5rem; background: var(--card); border: 0.5px solid var(--border); border-radius: 10px; padding: 4px; width: fit-content; }
.ptab { padding: 6px 18px; border-radius: 7px; font-size: 13px; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); font-family: inherit; transition: all 0.15s; }
.ptab.active { background: var(--grad); color: #171206; font-weight: 600; }
.g4k { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 1.5rem; }
.kcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; }
.kcard .lbl { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.kcard .val { font-size: 22px; font-weight: 600; }

.ctrls { display: flex; gap: 12px; margin-bottom: 0.75rem; }
.ctrls input, .ctrls select { background: var(--card2); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--text-primary); outline: none; font-family: inherit; }
.ctrls input { flex: 1; }
.ctrls select { cursor: pointer; }

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 0.75rem; }
.legend span { display: flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.twrap { max-height: 480px; overflow-y: auto; border: 0.5px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 10px 8px; color: var(--text-secondary); font-weight: 500; background: rgba(228,190,110,.06); position: sticky; top: 0; border-bottom: 0.5px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
td { padding: 10px 8px; border-bottom: 0.5px solid var(--border); }
.sline { font-size: 12px; color: var(--text-muted); margin-top: 1rem; text-align: right; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }

@media (max-width: 900px) {
  .g4k { grid-template-columns: repeat(2,1fr); }
  .ctrls { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="bg-ambient"><div class="blob-a"></div><div class="blob-b"></div></div>

<div class="topbar">
  <div class="topbar-logo"><span style="font-size:20px">◆</span> Mobilli <span>Digital</span></div>
  <div class="topbar-nav">
    <a class="topbar-link active" href="/painel">Meta Ads</a>
    <a class="topbar-link" href="/tarefas">Tarefas</a>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="topbar-user" id="user-nome">—</span>
    <a class="btn-logout" href="/logout">Sair</a>
  </div>
</div>

<div class="main">
  <div class="inner">
    <div class="page-header">
      <h2>📊 Meta Ads</h2>
      <p>Visão geral das contas de anúncio dos seus clientes</p>
    </div>

    <div class="ptabs">
      <button class="ptab" onclick="setPeriod('hoje',this)">Hoje</button>
      <button class="ptab" onclick="setPeriod('ontem',this)">Ontem</button>
      <button class="ptab active" onclick="setPeriod('30',this)">30 dias</button>
      <button class="ptab" onclick="setPeriod('15',this)">15 dias</button>
      <button class="ptab" onclick="setPeriod('7',this)">7 dias</button>
    </div>

    <div class="g4k">
      <div class="kcard"><div class="lbl">Investimento</div><div class="val" id="kpi-spend">—</div></div>
      <div class="kcard"><div class="lbl">Resultados</div><div class="val" id="kpi-results">—</div></div>
      <div class="kcard"><div class="lbl">CPL médio</div><div class="val" id="kpi-cpl">—</div></div>
      <div class="kcard"><div class="lbl">Contas ativas</div><div class="val" id="kpi-active">—</div></div>
    </div>

    <div class="ctrls">
      <input type="text" id="search" placeholder="Buscar conta..." oninput="renderTable()">
      <select id="sortby" onchange="renderTable()">
        <option value="spend">Por gasto</option>
        <option value="results">Por resultados</option>
        <option value="cpl">Por CPL</option>
      </select>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>até R$10</span>
      <span><span class="dot" style="background:var(--amber)"></span>R$10–15</span>
      <span><span class="dot" style="background:var(--red)"></span>acima R$15</span>
    </div>
    <div class="twrap">
      <table>
        <thead><tr><th>Conta</th><th>Gasto</th><th>Leads</th><th>Conversas</th><th>CPL</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted)">Carregando...</td></tr></tbody>
      </table>
    </div>
    <p class="sline" id="sline">Resultados = leads + conversas iniciadas</p>
  </div>
</div>

<script>
let period='30', cache={}, tableData=[];

const fmt = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtI = v => Math.round(v).toLocaleString('pt-BR');
const cplColor = c => !c?'var(--text-muted)':c<=10?'var(--green)':c<=15?'var(--amber)':'var(--red)';

async function initAuth(){
  try{
    const r = await fetch('/api/me');
    const j = await r.json();
    if(j.ok && j.usuario) document.getElementById('user-nome').textContent = j.usuario.nome;
  }catch(e){ console.error(e); }
}

function setPeriod(p,el){
  period=p;
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  cache[p]?applyData(cache[p]):loadAds();
}

async function loadAds(){
  try{
    const r=await fetch('/api/meta-ads/minhas?period='+period);
    const j=await r.json();
    if(!j.ok){
      document.getElementById('tbody').innerHTML='<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted)">Erro ao carregar dados.</td></tr>';
      return;
    }
    cache[period]=j;applyData(j);
    const now=new Date().toLocaleString('pt-BR');
    document.getElementById('sline').textContent='Resultados = leads + conversas · '+now;
  }catch(e){console.error(e);}
}

function applyData(j){
  const k=j.kpis;
  document.getElementById('kpi-spend').textContent='R$ '+fmtI(k.spend);
  document.getElementById('kpi-results').textContent=fmtI(k.results);
  document.getElementById('kpi-cpl').textContent='R$ '+fmt(k.cpl);
  document.getElementById('kpi-active').textContent=k.active+' / '+k.total;
  tableData=j.accounts;
  renderTable();
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const s=document.getElementById('sortby').value;
  let rows=tableData.filter(d=>d.account_name.toLowerCase().includes(q));
  if(s==='spend')rows.sort((a,b)=>b.spend-a.spend);
  if(s==='results')rows.sort((a,b)=>b.total-a.total);
  if(s==='cpl')rows.sort((a,b)=>(a.cpl??99999)-(b.cpl??99999));
  const tbody=document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="5"><div class="empty-state">Nenhuma conta de anúncio vinculada aos seus clientes ainda.</div></td></tr>';
    return;
  }
  tbody.innerHTML=rows.map(d=>'<tr><td title="'+d.account_name+'">'+d.account_name+'</td><td>R$ '+fmt(d.spend)+'</td><td>'+fmtI(d.leads)+'</td><td>'+fmtI(d.msg)+'</td><td style="color:'+cplColor(d.cpl)+';font-weight:500">'+(d.cpl?'R$ '+fmt(d.cpl):'—')+'</td></tr>').join('');
}

// Init
initAuth();
loadAds();
</script>
</body>
</html>
