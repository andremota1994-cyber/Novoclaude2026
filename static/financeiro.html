<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro - Mobilli Digital</title>
<style>
:root {
  --bg: #0a0a0f; --card: #13131f; --card2: #1a1a2e;
  --border: #1e2040; --blue: #3b82f6; --blue-bright: #60a5fa;
  --text-primary: #f0f4ff; --text-secondary: #8892b0; --text-muted: #4a5568;
  --green: #10b981; --amber: #f59e0b; --purple: #8b5cf6;
  --red: #ef4444; --red-bg: #1a0a0a; --red-border: #3d1515;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; flex-direction: column; }

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
.topbar-logo { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-primary); }
.topbar-logo span { color: var(--blue); }
.topbar-nav { display: flex; gap: 2px; flex-wrap: wrap; }
.topbar-link { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; display: inline-block; }
.topbar-link:hover { color: var(--text-primary); background: var(--card); }
.topbar-link.active { color: var(--text-primary); }

.main { flex: 1; overflow-y: auto; padding: 2rem; }
.inner { max-width: 920px; margin: 0 auto; }

.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
.page-header-left h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.page-header-left p { font-size: 13px; color: var(--text-secondary); }

.mes-nav { display: flex; align-items: center; gap: 10px; background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 6px 10px; }
.mes-nav button { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 15px; padding: 2px 6px; }
.mes-nav button:hover { color: var(--text-primary); }
.mes-nav span { font-size: 13px; min-width: 90px; text-align: center; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.kpi { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 1rem 1.1rem; }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.kpi-value { font-size: 21px; font-weight: 600; }
.kpi.green .kpi-value { color: var(--green); }
.kpi.red .kpi-value { color: var(--red); }
.kpi.blue .kpi-value { color: var(--blue-bright); }
.kpi.amber .kpi-value { color: var(--amber); }

.categorias { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.cat-chip { flex: 1; min-width: 140px; background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 0.8rem 1rem; }
.cat-chip .lbl { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.cat-chip .val { font-size: 16px; font-weight: 600; }

.section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }

.add-form { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 1.5rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.add-form .field { display: flex; flex-direction: column; gap: 4px; }
.add-form label { font-size: 11px; color: var(--text-secondary); }
.add-form input, .add-form select { background: var(--card2); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text-primary); padding: 8px 10px; font-size: 13px; font-family: inherit; }
.add-form input[type="text"] { min-width: 180px; }
.add-form input[type="number"] { width: 120px; }
.btn-add { height: 36px; padding: 0 18px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit; border: none; background: var(--blue); color: white; font-weight: 500; }
.btn-add:hover { background: var(--blue-bright); }

table { width: 100%; border-collapse: collapse; background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; overflow: hidden; }
th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 0.5px solid var(--border); }
th { color: var(--text-secondary); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; }
tr:last-child td { border-bottom: none; }
.tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
.tag.fixo { background: rgba(59,130,246,0.15); color: var(--blue-bright); }
.tag.variavel { background: rgba(245,158,11,0.15); color: var(--amber); }
.tag.salario { background: rgba(139,92,246,0.15); color: var(--purple); }
.btn-icon { background: transparent; border: none; cursor: pointer; font-size: 15px; color: var(--text-secondary); padding: 4px; }
.btn-icon:hover { color: var(--red); }
.check-pago { width: 16px; height: 16px; cursor: pointer; accent-color: var(--green); }
.empty-row { text-align: center; color: var(--text-muted); padding: 2rem !important; }
.loading-box { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 2rem; text-align: center; color: var(--text-secondary); font-size: 14px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/">📡 Mobilli <span>Digital</span></a>
  <div class="topbar-nav">
    <a class="topbar-link" href="/">Início</a>
    <a class="topbar-link" href="/faturamento">Faturamento</a>
    <a class="topbar-link" href="/tarefas">Tarefas</a>
    <a class="topbar-link" href="/briefing">Briefing</a>
    <a class="topbar-link active" href="/financeiro">Financeiro</a>
    <a class="topbar-link" href="/agenda">Agenda</a>
  </div>
</div>

<div class="main">
  <div class="inner">
    <div class="page-header">
      <div class="page-header-left">
        <h2>💰 Financeiro</h2>
        <p>Entrada, saída, custos fixos/variáveis e salários</p>
      </div>
      <div class="mes-nav">
        <button onclick="mudarMes(-1)">◀</button>
        <span id="mes-label">--</span>
        <button onclick="mudarMes(1)">▶</button>
      </div>
    </div>

    <div id="conteudo">
      <div class="loading-box">Carregando...</div>
    </div>
  </div>
</div>

<script>
let mesAtual = new Date().toISOString().slice(0,7);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function labelMes(mes){
  const [ano, m] = mes.split('-').map(Number);
  return MESES[m-1] + ' / ' + ano;
}

function mudarMes(delta){
  let [ano, m] = mesAtual.split('-').map(Number);
  m += delta;
  if (m < 1) { m = 12; ano--; }
  if (m > 12) { m = 1; ano++; }
  mesAtual = ano + '-' + String(m).padStart(2,'0');
  carregar();
}

function fmt(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

async function carregar(){
  document.getElementById('mes-label').textContent = labelMes(mesAtual);
  document.getElementById('conteudo').innerHTML = '<div class="loading-box">Carregando...</div>';
  try {
    const r = await fetch('/api/financeiro/resumo?mes=' + mesAtual);
    const j = await r.json();
    if (!j.ok) { document.getElementById('conteudo').innerHTML = '<div class="loading-box">Erro: ' + j.error + '</div>'; return; }
    render(j);
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="loading-box">Erro de conexão.</div>';
  }
}

function render(j){
  const cat = j.por_categoria || {fixo:0, variavel:0, salario:0};
  const linhas = (j.despesas || []).map(d => `
    <tr>
      <td>${d.descricao}</td>
      <td><span class="tag ${d.categoria}">${d.categoria === 'fixo' ? 'Fixo' : d.categoria === 'variavel' ? 'Variável' : 'Salário'}</span></td>
      <td>${fmt(d.valor)}</td>
      <td><input type="checkbox" class="check-pago" ${d.pago ? 'checked' : ''} onchange="togglePago(${d.id}, this.checked)"></td>
      <td><button class="btn-icon" onclick="excluirDespesa(${d.id})">🗑️</button></td>
    </tr>
  `).join('') || '<tr><td class="empty-row" colspan="5">Nenhuma despesa lançada neste mês.</td></tr>';

  document.getElementById('conteudo').innerHTML = `
    <div class="kpis">
      <div class="kpi green"><div class="kpi-label">Entrada (recebido)</div><div class="kpi-value">${fmt(j.entrada)}</div></div>
      <div class="kpi red"><div class="kpi-label">Saída</div><div class="kpi-value">${fmt(j.saida)}</div></div>
      <div class="kpi ${j.saldo >= 0 ? 'blue' : 'red'}"><div class="kpi-label">Saldo</div><div class="kpi-value">${fmt(j.saldo)}</div></div>
      <div class="kpi amber"><div class="kpi-label">Esperado (total clientes)</div><div class="kpi-value">${fmt(j.esperado)}</div></div>
    </div>

    <div class="categorias">
      <div class="cat-chip"><div class="lbl">Custos fixos</div><div class="val">${fmt(cat.fixo)}</div></div>
      <div class="cat-chip"><div class="lbl">Custos variáveis</div><div class="val">${fmt(cat.variavel)}</div></div>
      <div class="cat-chip"><div class="lbl">Salários</div><div class="val">${fmt(cat.salario)}</div></div>
    </div>

    <div class="section-title">Nova despesa</div>
    <div class="add-form">
      <div class="field"><label>Descrição</label><input type="text" id="f-descricao" placeholder="Ex: Aluguel do escritório"></div>
      <div class="field"><label>Categoria</label>
        <select id="f-categoria">
          <option value="fixo">Fixo</option>
          <option value="variavel">Variável</option>
          <option value="salario">Salário</option>
        </select>
      </div>
      <div class="field"><label>Valor (R$)</label><input type="number" id="f-valor" min="0.01" step="0.01" placeholder="0,00"></div>
      <button class="btn-add" onclick="adicionarDespesa()">+ Adicionar</button>
    </div>

    <div class="section-title">Despesas de ${labelMes(mesAtual)}</div>
    <table>
      <thead><tr><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Pago</th><th></th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
  `;
}

async function adicionarDespesa(){
  const descricao = document.getElementById('f-descricao').value.trim();
  const categoria = document.getElementById('f-categoria').value;
  const valor = parseFloat(document.getElementById('f-valor').value);
  if (!descricao || isNaN(valor) || valor <= 0) { alert('Preencha descrição e um valor válido.'); return; }
  const r = await fetch('/api/despesas', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({descricao, categoria, valor, mes: mesAtual, pago: false, recorrente: false})
  });
  const j = await r.json();
  if (!j.ok) { alert('Não foi possível salvar a despesa.'); return; }
  carregar();
}

async function togglePago(id, pago){
  await fetch('/api/despesas/' + id, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pago})});
  carregar();
}

async function excluirDespesa(id){
  if (!confirm('Excluir esta despesa?')) return;
  await fetch('/api/despesas/' + id, {method: 'DELETE'});
  carregar();
}

carregar();
</script>
</body>
</html>
