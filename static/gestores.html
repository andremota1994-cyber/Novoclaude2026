<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/icone-192.png">
<link rel="apple-touch-icon" href="/static/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mobilli">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060504">
<title>Gestores - Mobilli Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #060504; --card: rgba(228,190,110,0.055); --card2: rgba(228,190,110,0.10);
  --border: rgba(228,190,110,0.16); --border-strong: rgba(228,190,110,0.30);
  --blue: #d4af37; --blue-bright: #f3d888;
  --grad: linear-gradient(135deg, #f3d888, #9c7a24);
  --text-primary: #f7f3ea; --text-secondary: #a89a78; --text-muted: #6b6047;
  --green: #2fd97f; --amber: #ff9d42; --purple: #c9a8ff;
  --red: #ff5c72; --red-bg: rgba(255,92,114,0.08); --red-border: rgba(255,92,114,0.28);
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; flex-direction: column; position: relative; }
.bg-ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob-a, .blob-b { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; }
.blob-a { width: 520px; height: 520px; background: radial-gradient(circle, rgba(212,175,55,.35), transparent 70%); top: -160px; left: -120px; animation: driftA 24s ease-in-out infinite; }
.blob-b { width: 480px; height: 480px; background: radial-gradient(circle, rgba(156,122,36,.28), transparent 70%); bottom: -180px; right: -140px; animation: driftB 28s ease-in-out infinite; }
@keyframes driftA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
@keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
.topbar, .main { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .blob-a, .blob-b { animation: none !important; } * { transition: none !important; } }

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
.topbar-logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text-primary); font-family: 'Sora', sans-serif; }
.topbar-logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.topbar-nav { display: flex; gap: 2px; flex-wrap: wrap; }
.topbar-link { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; display: inline-block; }
.topbar-link:hover { color: var(--text-primary); background: var(--card); }
.topbar-link.active { color: var(--text-primary); }

.main { flex: 1; overflow-y: auto; padding: 2rem; }
.inner { max-width: 100%; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
.page-header-left h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.page-header-left p { font-size: 13px; color: var(--text-secondary); }

.search-box { position: relative; width: 260px; max-width: 100%; }
.search-box input { width: 100%; height: 38px; background: var(--card); border: 0.5px solid var(--border); border-radius: 8px; padding: 0 34px 0 12px; font-size: 13px; color: var(--text-primary); outline: none; font-family: inherit; transition: border-color .15s, background .15s; }
.search-box input:focus { border-color: var(--border-strong); background: var(--card2); }
.search-box input::placeholder { color: var(--text-muted); }
.search-box .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 4px; display: none; }
.search-box .clear-btn:hover { color: var(--text-primary); }
.search-box.has-value .clear-btn { display: block; }
.ccard.search-hidden { display: none; }
.col-noresult { text-align: center; padding: 1.5rem 0.5rem; color: var(--text-muted); font-size: 12px; }

.board-wrap { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 1rem; align-items: flex-start; }
.col { flex: 0 0 280px; background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 220px); transition: border-color .15s, background .15s; }
.col.dragover { border-color: var(--blue); background: var(--card2); }
.col-header { padding: 14px 14px 10px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.col-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.col-title.admin { color: var(--blue-bright); }
.col-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.col-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.col-empty { text-align: center; padding: 1.5rem 0.5rem; color: var(--text-muted); font-size: 12px; }

.ccard { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; cursor: grab; transition: transform .12s, box-shadow .12s, opacity .12s; }
.ccard:active { cursor: grabbing; }
.ccard.dragging { opacity: 0.4; }
.ccard:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.ccard .nm { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.ccard .emp { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.ccard .val { font-size: 11px; color: var(--text-muted); }
.col-tarefas { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--card2); border: 0.5px solid var(--border); text-decoration: none; color: var(--text-primary); font-size: 12px; transition: border-color .15s; }
.col-tarefas:hover { border-color: var(--border-strong); }
.col-tarefas b { font-size: 16px; }
.col-tarefas .hoje { margin-left: auto; font-size: 10.5px; padding: 2px 8px; border-radius: 20px; background: rgba(255,157,66,.12); color: var(--amber); }
.col-tarefas.zerado { color: var(--text-muted); }
.col-tarefas.zerado b { color: var(--green); }
.col-fin { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--blue-bright); text-decoration: none; }
.col-fin:hover { text-decoration: underline; }
.col-links { display: flex; gap: 14px; align-items: center; }
.col-senha { background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; color: var(--text-secondary); }
.ccard .prio { margin-left: 6px; font-size: 11px; }
.ccard .conta { font-size: 11px; color: var(--blue-bright); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard .conta.sem { color: var(--text-muted); font-style: italic; }

.col-add { flex: 0 0 280px; border: 1.5px dashed var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; min-height: 120px; cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all .15s; }
.col-add:hover { border-color: var(--blue); color: var(--text-primary); background: var(--card); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
.modal { background: #0d0b08; border: 1px solid var(--border-strong); border-radius: 14px; padding: 1.5rem; max-width: 380px; width: 100%; }
.modal h3 { font-size: 16px; margin-bottom: 1rem; }
.modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.5; }
.modal input { width: 100%; height: 40px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--text-primary); outline: none; font-family: inherit; margin-bottom: 1rem; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; border: none; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 0.5px solid var(--border); }
.btn-primary { background: var(--grad); color: #171206; }
.cred-box { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; margin-bottom: 1rem; }
.cred-box div { margin-bottom: 4px; }
.cred-box strong { color: var(--blue-bright); }
.loading { text-align: center; padding: 3rem; color: var(--text-muted); }

@media (max-width: 700px) {
  .main { padding: 1.25rem; }
}
</style>
</head>
<body>
<div class="bg-ambient"><div class="blob-a"></div><div class="blob-b"></div></div>

<div class="topbar" id="menu-principal"></div>
<script src="/static/menu.js"></script>
<div class="main">
  <div class="inner">
    <div class="page-header">
      <div class="page-header-left">
        <h2>🧑‍💼 Gestores</h2>
        <p>Arraste um cliente de uma coluna para outra para trocar o gestor responsável</p>
      </div>
      <div class="search-box" id="search-box">
        <input type="text" id="busca-conta" placeholder="Buscar conta..." oninput="onBuscaInput()">
        <button class="clear-btn" onclick="limparBusca()" title="Limpar">✕</button>
      </div>
    </div>
    <div class="board-wrap" id="board-wrap">
      <div class="loading">Carregando...</div>
    </div>
  </div>
</div>

<!-- MODAL NOVO GESTOR -->
<div class="modal-overlay" id="modal-novo" style="display:none">
  <div class="modal">
    <h3>+ Novo gestor</h3>
    <input type="text" id="novo-nome" placeholder="Nome do gestor" onkeydown="if(event.key==='Enter')criarGestor()">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModalNovo()">Cancelar</button>
      <button class="btn btn-primary" onclick="criarGestor()">Criar</button>
    </div>
  </div>
</div>

<!-- MODAL CREDENCIAIS -->
<div class="modal-overlay" id="modal-cred" style="display:none">
  <div class="modal">
    <h3 id="cred-titulo">✅ Gestor criado</h3>
    <p id="cred-texto">Anote esses dados agora — a senha temporária não será mostrada de novo. Repasse ao gestor para o primeiro acesso.</p>
    <div class="cred-box" id="cred-box"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModalCred()">Entendi</button>
    </div>
  </div>
</div>

<script>
let usuarios = [];
let clientes = [];
let dragCliente = null;
let busca = '';

async function carregar(){
  try{
    const r = await fetch('/api/gestores/board');
    const j = await r.json();
    if(!j.ok){
      document.getElementById('board-wrap').innerHTML = '<div class="loading">Erro ao carregar.</div>';
      return;
    }
    usuarios = j.usuarios;
    clientes = j.clientes;
    tarefasPend = j.tarefas || {};
    render();
  }catch(e){
    console.error(e);
    document.getElementById('board-wrap').innerHTML = '<div class="loading">Erro de conexão.</div>';
  }
}

function escHtml(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let tarefasPend = {};
function blocoTarefas(u){
  const t = tarefasPend[String(u.id)] || {total: 0, hoje: 0};
  const txt = t.total === 1 ? 'tarefa pendente' : 'tarefas pendentes';
  return `<a class="col-tarefas ${t.total ? '' : 'zerado'}" href="/tarefas?responsavel=${u.id}" title="Ver as tarefas de ${escHtml(u.nome)}">
    📋 <b>${t.total}</b> ${txt}${t.hoje ? `<span class="hoje">${t.hoje} para hoje</span>` : ''}</a>`;
}

function fmtValor(v){
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function bate(c){
  if(!busca) return true;
  return [c.nome, c.empresa, c.conta_anuncio].some(v=>(v||'').toLowerCase().includes(busca));
}

function render(){
  const wrap = document.getElementById('board-wrap');
  const rolagem = wrap.scrollLeft;
  const cols = usuarios.map(u=>{
    const meusClientes = clientes.filter(c=>c.gestor_id===u.id);
    const visiveis = meusClientes.filter(bate);
    const total = meusClientes.reduce((s,c)=>s+Number(c.valor||0),0);
    const titulo = u.role==='admin' ? ('Eu (' + u.nome + ')') : u.nome;
    let cardsHtml;
    if(!meusClientes.length){
      cardsHtml = '<div class="col-empty">Nenhum cliente</div>';
    } else if(!visiveis.length){
      cardsHtml = '<div class="col-noresult">Nenhum resultado</div>';
    } else {
      cardsHtml = visiveis.map(c=>`
        <div class="ccard" draggable="true" data-id="${c.id}"
             ondragstart="onDragStart(event,${c.id})" ondragend="onDragEnd(event)">
          <div class="nm">${c.nome}${c.prioridade ? '<span class="prio">🔥</span>' : ''}</div>
          <div class="emp">${c.empresa || '—'}</div>
          <div class="conta ${c.conta_anuncio?'':'sem'}" title="Conta de anúncios que aparece no painel do gestor">${c.conta_anuncio ? '📊 '+escHtml(c.conta_anuncio) : 'Sem conta de anúncios'}</div>
          <div class="val">${fmtValor(c.valor)}/mês</div>
        </div>`).join('');
    }
    const nContas = new Set(meusClientes.map(c=>c.conta_anuncio).filter(Boolean)).size;
    const subInfo = busca
      ? (visiveis.length + ' de ' + meusClientes.length + ' cliente' + (meusClientes.length===1?'':'s'))
      : (meusClientes.length + ' cliente' + (meusClientes.length===1?'':'s') + ' · ' + nContas + ' conta' + (nContas===1?'':'s') + ' no painel · ' + fmtValor(total) + '/mês');
    return `
      <div class="col" id="col-${u.id}" ondragover="onDragOver(event,${u.id})" ondragleave="onDragLeave(event,${u.id})" ondrop="onDrop(event,${u.id})">
        <div class="col-header">
          <div class="col-title ${u.role==='admin'?'admin':''}">${titulo}</div>
          <div class="col-sub">${subInfo}</div>
          ${blocoTarefas(u)}
          ${u.role!=='admin' ? `<div class="col-links"><a class="col-fin" href="/meu-financeiro?gestor=${u.id}">💰 Financeiro</a><button class="col-fin col-senha" onclick="novaSenha(${u.id})">🔑 Nova senha</button></div>` : ''}
        </div>
        <div class="col-body" id="colbody-${u.id}">${cardsHtml}</div>
      </div>`;
  }).join('');
  wrap.innerHTML = cols + '<div class="col-add" onclick="openModalNovo()">+ Novo gestor</div>';
  wrap.scrollLeft = rolagem;
}

function onBuscaInput(){
  const input = document.getElementById('busca-conta');
  busca = input.value.toLowerCase().trim();
  document.getElementById('search-box').classList.toggle('has-value', !!input.value);
  render();
}
function limparBusca(){
  const input = document.getElementById('busca-conta');
  input.value = '';
  busca = '';
  document.getElementById('search-box').classList.remove('has-value');
  render();
  input.focus();
}

// ── DRAG & DROP ──
function onDragStart(e, clienteId){
  dragCliente = clienteId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(clienteId));
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  dragCliente = null;
}
function onDragOver(e, usuarioId){
  e.preventDefault();
  document.getElementById('col-'+usuarioId).classList.add('dragover');
}
function onDragLeave(e, usuarioId){
  document.getElementById('col-'+usuarioId).classList.remove('dragover');
}
async function onDrop(e, usuarioId){
  e.preventDefault();
  document.getElementById('col-'+usuarioId).classList.remove('dragover');
  const clienteId = dragCliente || parseInt(e.dataTransfer.getData('text/plain'));
  if(!clienteId) return;
  const cliente = clientes.find(c=>c.id===clienteId);
  if(!cliente || cliente.gestor_id===usuarioId) return;
  cliente.gestor_id = usuarioId;
  render();
  try{
    const r = await fetch('/api/clientes/'+clienteId+'/gestor', {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({gestor_id: usuarioId})
    });
    const j = await r.json().catch(()=>({ok:false, error:'resposta inválida ('+r.status+')'}));
    if(!j.ok) throw new Error(j.error || ('erro '+r.status));
  }catch(err){
    // A troca não foi gravada: avisa e volta o quadro para o que está no banco
    console.error(err);
    alert('Não foi possível trocar o gestor de '+cliente.nome+': '+err.message+'\nO quadro foi recarregado.');
    carregar();
  }
}

// ── NOVO GESTOR ──
function openModalNovo(){
  document.getElementById('novo-nome').value = '';
  document.getElementById('modal-novo').style.display = 'flex';
  setTimeout(()=>document.getElementById('novo-nome').focus(), 50);
}
function closeModalNovo(){ document.getElementById('modal-novo').style.display = 'none'; }

async function criarGestor(){
  const nome = document.getElementById('novo-nome').value.trim();
  if(!nome) return;
  try{
    const r = await fetch('/api/usuarios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nome})
    });
    const j = await r.json();
    if(!j.ok){ alert(j.error||'Erro ao criar gestor.'); return; }
    closeModalNovo();
    document.getElementById('cred-titulo').textContent = '✅ Gestor criado';
    document.getElementById('cred-texto').textContent = 'Anote esses dados agora — a senha temporária não será mostrada de novo. Repasse ao gestor para o primeiro acesso.';
    document.getElementById('cred-box').innerHTML =
      '<div>Nome: <strong>'+j.data.nome+'</strong></div>' +
      '<div>Usuário: <strong>'+j.data.username+'</strong></div>' +
      '<div>Senha temporária: <strong>'+j.data.senha_temp+'</strong></div>';
    document.getElementById('modal-cred').style.display = 'flex';
    carregar();
  }catch(e){
    alert('Erro de conexão.');
  }
}
async function novaSenha(id){
  const u = usuarios.find(x=>x.id===id);
  if(!u || !confirm('Gerar uma senha nova para ' + u.nome + '?\n\nA senha atual deixa de funcionar na hora.')) return;
  try{
    const j = await (await fetch('/api/usuarios/' + id + '/nova-senha', {method: 'POST'})).json();
    if(!j.ok){ alert('Não foi possível gerar a senha: ' + j.error); return; }
    document.getElementById('cred-titulo').textContent = '🔑 Senha nova de ' + j.data.nome;
    document.getElementById('cred-texto').textContent = 'Anote agora — esta senha não será mostrada de novo. Repasse ao gestor; a senha antiga já não funciona.';
    document.getElementById('cred-box').innerHTML =
      '<div>Usuário: <strong>' + escHtml(j.data.username) + '</strong></div>' +
      '<div>Senha: <strong>' + escHtml(j.data.senha_temp) + '</strong></div>';
    document.getElementById('modal-cred').style.display = 'flex';
  }catch(e){ alert('Erro de conexão.'); }
}
function closeModalCred(){ document.getElementById('modal-cred').style.display = 'none'; }

// Init
carregar();

// Atualiza sozinho a cada minuto (tarefas pendentes, clientes), sem atrapalhar arraste ou janela aberta
setInterval(() => {
  if (document.visibilityState !== 'visible' || dragCliente) return;
  if ([...document.querySelectorAll('.modal-overlay')].some(m => m.style.display !== 'none')) return;
  carregar();
}, 60000);
</script>
<script src="/static/push.js"></script>
</body>
</html>
