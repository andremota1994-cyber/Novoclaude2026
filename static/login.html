<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobilli Digital — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #060504;
    --card: rgba(228,190,110,0.06);
    --border: rgba(228,190,110,0.18);
    --border-strong: rgba(228,190,110,0.32);
    --blue: #d4af37;
    --blue-bright: #f3d888;
    --grad: linear-gradient(135deg, #f3d888, #9c7a24);
    --text-primary: #f7f3ea;
    --text-secondary: #a89a78;
    --text-muted: #6b6047;
    --red: #ff5c72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .bg-ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob-a, .blob-b { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; }
  .blob-a { width: 520px; height: 520px; background: radial-gradient(circle, rgba(212,175,55,.35), transparent 70%); top: -160px; left: -120px; animation: driftA 24s ease-in-out infinite; }
  .blob-b { width: 480px; height: 480px; background: radial-gradient(circle, rgba(156,122,36,.28), transparent 70%); bottom: -180px; right: -140px; animation: driftB 28s ease-in-out infinite; }
  @keyframes driftA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
  @keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }
  .watermark { position: fixed; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .watermark img { width: 42vw; max-width: 480px; opacity: .045; filter: grayscale(1) brightness(1.8); }
  .login-wrap { position: relative; z-index: 1; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .blob-a, .blob-b { animation: none !important; }
    .login-wrap { animation: none !important; opacity: 1 !important; transform: none !important; }
    * { transition: none !important; }
  }

  .login-wrap { width: 100%; max-width: 360px; padding: 2rem; opacity: 0; animation: fadeUp .6s ease forwards; }

  .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 2.5rem; gap: 12px; }
  .logo-icon { width: 64px; height: 64px; background: var(--card); border: 1px solid var(--border-strong); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(212,175,55,0.18); overflow: hidden; }
  .logo-icon img { width: 40px; height: 40px; object-fit: contain; }
  .logo-name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; font-family: 'Sora', sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo-sub { font-size: 13px; color: var(--text-secondary); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,.4); }

  .form-group { margin-bottom: 1rem; }
  .form-group label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input { width: 100%; height: 42px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; font-size: 15px; color: var(--text-primary); outline: none; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
  .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(212,175,55,.15); }

  .btn-login { width: 100%; height: 42px; background: var(--grad); border: none; border-radius: 10px; font-size: 15px; font-weight: 600; color: #171206; cursor: pointer; font-family: inherit; transition: filter 0.15s, transform 0.15s; margin-top: 0.5rem; }
  .btn-login:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

  .error { font-size: 13px; color: var(--red); text-align: center; margin-top: 0.75rem; display: none; }
  .error.show { display: block; }
</style>
</head>

  <div class="card">
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" onkeydown="handleKey(event)" autofocus>
    </div>
    <button class="btn-login" id="btn-login" onclick="login()">Entrar</button>
    <div class="error" id="error">Senha incorreta. Tente novamente.</div>
  </div>
</div>

<script>
async function login(){
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error');
  if(!senha) return;
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  err.classList.remove('show');
  try{
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({senha})
    });
    const j = await r.json();
    if(j.ok){
      window.location.href = '/';
    } else {
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      document.getElementById('senha').value = '';
      document.getElementById('senha').focus();
    }
  }catch(e){
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function handleKey(e){ if(e.key==='Enter') login(); }
</script>
