<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobilli Digital — Login</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #13131f;
    --border: #1e2040;
    --blue: #3b82f6;
    --blue-bright: #60a5fa;
    --text-primary: #f0f4ff;
    --text-secondary: #8892b0;
    --text-muted: #4a5568;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; align-items: center; justify-content: center; }

  .login-wrap { width: 100%; max-width: 360px; padding: 2rem; }

  .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 2.5rem; gap: 12px; }
  .logo-icon { width: 56px; height: 56px; background: var(--blue); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 0 30px #3b82f622; }
  .logo-name { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 13px; color: var(--text-secondary); }

  .card { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.75rem; }

  .form-group { margin-bottom: 1rem; }
  .form-group label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input { width: 100%; height: 42px; background: #0a0a0f; border: 0.5px solid var(--border); border-radius: 10px; padding: 0 14px; font-size: 15px; color: var(--text-primary); outline: none; font-family: inherit; transition: border-color 0.2s; }
  .form-group input:focus { border-color: #374151; }

  .btn-login { width: 100%; height: 42px; background: var(--text-primary); border: none; border-radius: 10px; font-size: 15px; font-weight: 500; color: var(--bg); cursor: pointer; font-family: inherit; transition: opacity 0.15s; margin-top: 0.5rem; }
  .btn-login:hover { opacity: 0.9; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

  .error { font-size: 13px; color: var(--red); text-align: center; margin-top: 0.75rem; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">📡</div>
    <div class="logo-name">Mobilli Digital</div>
    <div class="logo-sub">Acesso restrito</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" onkeydown="handleKey(event)" autofocus>
    </div>
    <button class="btn-login" id="btn-login" onclick="login()">Entrar</button>
    <div class="error" id="error">Senha incorreta. Tente novamente.</div>
  </div>
</div>

<script>
async function login(){
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error');
  if(!senha) return;
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  err.classList.remove('show');
  try{
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({senha})
    });
    const j = await r.json();
    if(j.ok){
      window.location.href = '/';
    } else {
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      document.getElementById('senha').value = '';
      document.getElementById('senha').focus();
    }
  }catch(e){
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function handleKey(e){ if(e.key==='Enter') login(); }
</script>
</body>
</html>
