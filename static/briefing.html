<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefing - Mobilli Digital</title>
<style>
:root {
  --bg: #0a0a0f; --card: #13131f; --card2: #1a1a2e;
  --border: #1e2040; --blue: #3b82f6; --blue-bright: #60a5fa;
  --text-primary: #f0f4ff; --text-secondary: #8892b0; --text-muted: #4a5568;
  --green: #10b981; --amber: #f59e0b; --purple: #8b5cf6;
  --red: #ef4444; --red-bg: #1a0a0a; --red-border: #3d1515;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-primary); display: flex; flex-direction: column; }

.topbar { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.topbar-logo { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-primary); }
.topbar-logo span { color: var(--blue); }
.topbar-nav { display: flex; gap: 2px; }
.topbar-link { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; text-decoration: none; display: inline-block; }
.topbar-link:hover { color: var(--text-primary); background: var(--card); }
.topbar-link.active { color: var(--text-primary); }

.main { flex: 1; overflow-y: auto; padding: 2rem; }
.inner { max-width: 780px; margin: 0 auto; }

.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
.page-header-left h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.page-header-left p { font-size: 13px; color: var(--text-secondary); }
.btn-refresh { height: 36px; padding: 0 16px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit; border: 0.5px solid var(--border); background: var(--card); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
.btn-refresh:hover { color: var(--text-primary); background: var(--card2); }
.btn-refresh:disabled { opacity: 0.5; cursor: default; }

.loading-box { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 3rem 1.5rem; text-align: center; color: var(--text-secondary); font-size: 14px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--blue); animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-box { background: var(--red-bg); border: 0.5px solid var(--red-border); border-radius: 16px; padding: 1.5rem; color: var(--red); font-size: 13px; }

.cards { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 0.5px solid var(--border); border-radius: 16px; padding: 1.1rem 1.25rem; border-left: 3px solid var(--accent, var(--blue)); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.card-emoji { font-size: 18px; width: 32px; height: 32px; border-radius: 10px; background: var(--card2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-title { font-size: 14px; font-weight: 600; }
.card-body { font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); }
.card-body p { margin-bottom: 6px; }
.card-body p:last-child { margin-bottom: 0; }
.card-body strong { color: var(--text-primary); }

.foot-note { margin-top: 1.5rem; text-align: center; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/">📡 Mobilli <span>Digital</span></a>
  <div class="topbar-nav">
    <a class="topbar-link" href="/">Início</a>
    <a class="topbar-link" href="/faturamento">Faturamento</a>
    <a class="topbar-link" href="/tarefas">Tarefas</a>
    <a class="topbar-link active" href="/briefing">Briefing</a>
    <a class="topbar-link" href="/financeiro">Financeiro</a>
    <a class="topbar-link" href="/agenda">Agenda</a>
  </div>
</div>

<div class="main">
  <div class="inner">
    <div class="page-header">
      <div class="page-header-left">
        <h2>☀️ Briefing da manhã</h2>
        <p id="data-label">Carregando...</p>
      </div>
      <button class="btn-refresh" id="btn-refresh" onclick="carregarBriefing()">🔄 Atualizar</button>
    </div>

    <div id="conteudo">
      <div class="loading-box">
        <div class="spinner"></div>
        Reunindo a equipe...
      </div>
    </div>

    <div class="foot-note">Gerado com base nos dados ao vivo de Faturamento, Meta Ads e Tarefas.</div>
  </div>
</div>

<script>
const PESSOAS = {
  'amy':     { emoji: '🗓️', color: '#3b82f6' },
  'claudio': { emoji: '💰', color: '#10b981' },
  'bryan':   { emoji: '📈', color: '#f59e0b' },
  'emerson': { emoji: '🚀', color: '#8b5cf6' },
  'anna':    { emoji: '🎨', color: '#ef4444' }
};

function getPersona(title){
  const key = Object.keys(PESSOAS).find(k => title.toLowerCase().includes(k));
  return PESSOAS[key] || { emoji: '👤', color: '#60a5fa' };
}

function formatBody(text){
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .split('\n').map(l => l.trim() ? '<p>' + l.trim() + '</p>' : '').join('');
}

function parseBriefing(text){
  const re = /\*\*(.+?)\*\*:?/g;
  const matches = [...text.matchAll(re)];
  if (!matches.length) return [{ title: 'Equipe', body: text }];
  const blocks = [];
  for (let i = 0; i < matches.length; i++){
    const start = matches[i].index + matches[i][0].length;
    const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
    let body = text.slice(start, end).replace(/^[\s\-=]+/, '').replace(/[\s\-=]+$/, '').trim();
    const title = matches[i][1].replace(/:\s*$/, '').trim();
    if (body) blocks.push({ title, body });
  }
  return blocks.length ? blocks : [{ title: 'Equipe', body: text }];
}

function renderBriefing(text){
  const blocks = parseBriefing(text);
  const html = blocks.map(b => {
    const p = getPersona(b.title);
    return '<div class="card" style="--accent:' + p.color + '">' +
      '<div class="card-head">' +
        '<div class="card-emoji">' + p.emoji + '</div>' +
        '<div class="card-title">' + b.title + '</div>' +
      '</div>' +
      '<div class="card-body">' + formatBody(b.body) + '</div>' +
    '</div>';
  }).join('');
  document.getElementById('conteudo').innerHTML = '<div class="cards">' + html + '</div>';
}

async function carregarBriefing(){
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  document.getElementById('conteudo').innerHTML = '<div class="loading-box"><div class="spinner"></div>Reunindo a equipe...</div>';
  try {
    const r = await fetch('/api/briefing');
    const j = await r.json();
    if (j.ok){
      renderBriefing(j.briefing);
      document.getElementById('data-label').textContent = j.data || '';
    } else {
      document.getElementById('conteudo').innerHTML = '<div class="error-box">❌ Erro ao montar o briefing: ' + j.error + '</div>';
      document.getElementById('data-label').textContent = '';
    }
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="error-box">❌ Erro de conexão.</div>';
  }
  btn.disabled = false;
}

carregarBriefing();
</script>
</body>
</html>
